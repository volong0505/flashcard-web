<div>
    <!-- <text-to-speech class="speak" [text]="sentence.sentence" /><span>{{sentence.translation}} <span> 
        </span></span> -->
    <nz-collapse nzGhost>
        <nz-collapse-panel [nzHeader]="sentence.translation" [nzActive]="false">
            <p style="margin:0;">
                {{sentence.sentence}}
            </p>
        </nz-collapse-panel>
    </nz-collapse>

    <div>
        <text-to-speech class="speak" [text]="sentence.sentence" />
        <nz-space nzDirection="vertical" style="width: 90%">
            <input (change)="onCheck($event)" *nzSpaceItem nz-input nzVariant="underlined" />
        </nz-space>
        <nz-icon [nzType]="this.inputStatus().type" nzTheme="outline" [style.color]="this.inputStatus().color" />
    </div>
</div>
